# Every push to main publishes site/ to GitHub Pages (www.archangx.com). Free, no servers.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every linked file exists
        run: python3 tools/check_site.py
      - name: Add content hashes to asset URLs, so visitors get changed CSS and images without clearing their cache
        run: bash tools/fingerprint_assets.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploying is a separate job so that, if it fails, "Re-run failed jobs" deploys the one artifact already uploaded.
  # Re-running the upload in the same run adds a second "github-pages" artifact, and deploy-pages refuses to choose.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
